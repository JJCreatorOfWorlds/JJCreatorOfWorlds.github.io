<!DOCTYPE html>
<html>
    <head>
        <link href="styles.css" rel="stylesheet"/>
        <link rel="icon" href="img/favicon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz@8..60&display=swap" rel="stylesheet">
        <title>JJ Irons</title>
    </head>
<body>
    <div id="app">
        <!-- ===================== Page Loading ===================== -->
        <div v-if="loadingData" class="loading-data">Loading...</div>

        <!-- ======================================================== -->
        <!-- ====================== Home Page ======================= -->
        <!-- ======================================================== -->
        <div class="contents" v-if="!loadingData">
            <div class="header">
                <!-- carousel removed: centered logo only -->
                <div class="info" style="width:100%; display:flex; justify-content:center;">
                    <img src="img/JJLogo.png" alt="JJ Irons, Artist, Craftsman, Designer" class="body-img">
                </div>
            </div>
            
            <!-- All projects in one big responsive grid -->
            <div class="body-grid">
                <div v-for="(project, index) in allProjects"
                     :key="index"
                     class="body-item"
                     role="button"
                     tabindex="0"
                     :aria-label="project.name"
                     @click="openSidebar(project)"
                     @keydown.enter.prevent="openSidebar(project)"
                     @keydown.space.prevent="openSidebar(project)">
                    <img :src="project.img" :alt="project.alt || project.name" class="body-img" loading="lazy">
                    <div class="project-caption">
                        <h3>{{project.name}}</h3>
                        <p>{{project.description}}</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Overlay + Sidebar for project details -->
        <div v-if="sidebarOpen">
            <div class="overlay" @click="closeSidebar"></div>
            <aside class="sidebar">
                <button class="close" @click="closeSidebar">✕</button>
                <div class="sidebar-photo">
                    <img :src="activeProject.img" :alt="activeProject.alt || activeProject.name" loading="lazy">
                </div>
                <div class="sidebar-content">
                    <h2>{{activeProject.name}}</h2>
                    <p>{{activeProject.description}}</p>
                    <p v-if="activeProject._category" class="muted">Category: {{activeProject._category}}</p>
                </div>
            </aside>
        </div>

        <div class="footer">
            <div class="counter">
                <script type="text/javascript" src="https://www.free-counters.org/count/faah"></script><br>
            </div>   
            <div class="logos">
                <img src="img/contacts.png" alt="contacts, JJCreatorOfWorld and me@jjirons.com" height="100px">
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14"></script>
<script src="main.js"></script>
</html>
